<script>/* FB-THEME-INIT */
(function(){
  var saved = null;
  try { saved = localStorage.getItem('fb-theme'); } catch(e) {}
  if (saved === 'dark' || saved === 'light') document.documentElement.dataset.theme = saved;
  function effDark() {
    var t = document.documentElement.dataset.theme;
    if (t === 'dark') return true;
    if (t === 'light') return false;
    return window.matchMedia('(prefers-color-scheme: dark)').matches;
  }
  function paint() {
    var b = document.getElementById('themeToggle');
    if (b) b.textContent = effDark() ? '☀️' : '🌙';
  }
  window.fbToggleTheme = function() {
    var next = effDark() ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem('fb-theme', next); } catch(e) {}
    paint();
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', paint); else paint();
})();
</script>

        {b:"auf",s:"m"},
        {t:" d"},
        {b:"en",s:"s"},
        {t:" Speicher!"}
      ]
    },
    {
      id:16,
      segments:[
        {t:"Leg d"},
        {b:"ie",s:"s"},
        {t:" gebügelte Wäsche "},
        {b:"auf",s:"m"},
        {t:" d"},
        {b:"as",s:"s"},
        {t:" Bett!"}
      ]
    }
  ]
];

let userAnswers = [[],[]];

function renderExercises() {
  EXERCISES.forEach((secExs,secIdx)=>{
    const cont = document.getElementById(`ex-sec-${secIdx}`);
    cont.innerHTML = '';
    userAnswers[secIdx] = [];
    
    secExs.forEach(ex=>{
      const div = document.createElement('div');
      div.className = 'exercise';
      
      const sent = document.createElement('div');
      sent.className = 'sentence';
      
      const exAnswers = [];
      let blankIdx = 0;
      
      for(let i=0; i<ex.segments.length; i++){
        const seg = ex.segments[i];
        if(seg.t){
          // Prüfe ob Fragment (kein Leerzeichen am Ende) und nächstes ist blank
          const isFragment = !seg.t.endsWith(' ') && i+1<ex.segments.length && ex.segments[i+1].b;
          if(isFragment){
            const group = document.createElement('span');
            group.className = 'nowrap-group';
            const txt = document.createElement('span');
            txt.textContent = seg.t;
            group.appendChild(txt);
            sent.appendChild(group);
          } else {
            const txt = document.createElement('span');
            txt.textContent = seg.t;
            sent.appendChild(txt);
          }
        }
        if(seg.b){
          const currentBlankIdx = blankIdx;
          
          const inp = document.createElement('input');
          inp.type = 'text';
          inp.className = `blank ${seg.s}`;
          inp.dataset.answer = seg.b;
          inp.dataset.secIdx = secIdx;
          inp.dataset.exIdx = ex.id-1;
          inp.dataset.blankIdx = currentBlankIdx;
          
          inp.addEventListener('input',e=>{
            const si = parseInt(e.target.dataset.secIdx);
            const ei = parseInt(e.target.dataset.exIdx);
            const bi = parseInt(e.target.dataset.blankIdx);
            if(!userAnswers[si][ei]) userAnswers[si][ei]=[];
            userAnswers[si][ei][bi] = e.target.value.trim();
            e.target.classList.remove('correct','incorrect');
          });
          
          const sol = document.createElement('span');
          sol.className = 'solution';
          sol.textContent = `(${seg.b})`;
          
          // Wenn vorheriges Element eine nowrap-group ist, füge dort ein
          const prevElem = sent.lastElementChild;
          if(prevElem && prevElem.className === 'nowrap-group'){
            prevElem.appendChild(inp);
            prevElem.appendChild(sol);
          } else {
            sent.appendChild(inp);
            sent.appendChild(sol);
          }
          
          exAnswers.push(seg.b);
          blankIdx++;
        }
      }
      
      div.appendChild(sent);
      cont.appendChild(div);
      
      if(!userAnswers[secIdx][ex.id-1]){
        userAnswers[secIdx][ex.id-1] = new Array(exAnswers.length).fill('');
      }
    });
  });
}

function checkAnswers(secIdx){
  const inputs = document.querySelectorAll(`input[data-sec-idx="${secIdx}"]`);
  inputs.forEach(inp=>{
    const correct = inp.dataset.answer;
    const user = inp.value.trim().toLowerCase();
    inp.classList.remove('correct','incorrect');
    if(user === correct){
      inp.classList.add('correct');
    } else if(user !== ''){
      inp.classList.add('incorrect');
    }
  });
}

function showSolutions(secIdx){
  const sols = document.querySelectorAll(`#ex-sec-${secIdx} .solution`);
  sols.forEach(s=>s.classList.add('show'));
}

function resetExercises(secIdx){
  const inputs = document.querySelectorAll(`input[data-sec-idx="${secIdx}"]`);
  inputs.forEach(inp=>{
    inp.value = '';
    inp.classList.remove('correct','incorrect');
  });
  const sols = document.querySelectorAll(`#ex-sec-${secIdx} .solution`);
  sols.forEach(s=>s.classList.remove('show'));
  userAnswers[secIdx] = EXERCISES[secIdx].map(ex=>new Array(ex.segments.filter(s=>s.b).length).fill(''));
}

function showSection(idx){
  document.querySelectorAll('.section').forEach((s,i)=>s.classList.toggle('active',i===idx));
  document.querySelectorAll('.nav-btn').forEach((b,i)=>b.classList.toggle('active',i===idx));
}

renderExercises();
</script>

<!-- FB-JUMPTOP -->
<button class="fb-jumptop" id="fbJumpTop" onclick="window.scrollTo({top:0,behavior:'smooth'})" title="Nach oben springen" aria-label="Nach oben springen">↑ Nach oben</button>
<script>
(function(){
  var btn = document.getElementById('fbJumpTop');
  if (!btn) return;
  function toggle(){
    var scrollable = document.documentElement.scrollHeight > window.innerHeight + 60;
    btn.classList.toggle('show', scrollable);
  }
  window.addEventListener('scroll', toggle, {passive:true});
  window.addEventListener('resize', toggle);
  document.querySelectorAll('.nav-btn').forEach(function(b){ b.addEventListener('click', function(){ setTimeout(toggle, 60); }); });
  setTimeout(toggle, 80);
})();
</script>
